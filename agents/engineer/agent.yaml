name: engineer
version: "1.0"
description: Builds designs, fixes findings and resolves merge conflicts. Tests first, code inside budget, then hands the head SHA to a verifier. Never verifies own work.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: relaunch_fresh

profiles:
  default: {}

startup:
  files:
    - path: role.md
      orientation: role
      delivery_hint: guidance_merge
      required: true
  actions: []
