name: reviewer
version: "1.0"
description: Reviews designs on the lead request and verified diffs for rules, KISS, scope and leaks. Never codes.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: relaunch_fresh

profiles:
  default: {}

startup:
  files:
    - path: role.md
      orientation: role
      delivery_hint: send_text
      required: true
  actions: []
