name: reviewer
version: "1.0"
description: Code review. Reads designs and diffs against the mission SPEC and every rule file, files findings with file:line. Never runs tests, never codes.

defaults:
  runtime: codex
  lifecycle:
    restore_policy: relaunch_fresh

profiles:
  default: {}

startup:
  files:
    - path: role.md
      orientation: role
      delivery_hint: guidance_merge
      required: true
  actions: []
