name: lead
version: "1.0"
description: Lead pair. primary is Q's single channel and runs missions through the mission skill; peer keeps seats healthy.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: resume_if_possible

profiles:
  primary:
    summary: Main stream, dispatch, Q communication, final call.
    startup:
      files:
        - path: primary.md
          delivery_hint: guidance_merge
          required: true
  peer:
    summary: Coverage, stuck and idle seats, second-model perspective, review convergence.
    startup:
      files:
        - path: peer.md
          delivery_hint: guidance_merge
          required: true

startup:
  files:
    - path: role.md
      orientation: role
      delivery_hint: guidance_merge
      required: true
  actions: []
