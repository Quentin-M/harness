name: verifier
version: "1.0"
description: Machine evidence for one head SHA. Runs every gate the mission SPEC lists, captures and reads back media, writes the ledger row. Never fixes, never judges.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: relaunch_fresh

profiles:
  default: {}

startup:
  files:
    - path: role.md
      orientation: role
      delivery_hint: guidance_merge
      required: true
  actions: []
