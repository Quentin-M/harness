name: judge
version: "1.0"
description: Independent proof judge. Accepts or rejects each slice proof item against the mission SPEC, then closes the slice. Never authors evidence.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: relaunch_fresh

profiles:
  default: {}

startup:
  files:
    - path: role.md
      orientation: role
      delivery_hint: guidance_merge
      required: true
  actions: []
