name: architect
version: "1.0"
description: Writes the design (budget table, fault matrix, structures, test plan) before any code. Never codes.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: relaunch_fresh

profiles:
  default: {}

startup:
  files:
    - path: role.md
      orientation: role
      delivery_hint: guidance_merge
      required: true
  actions: []
