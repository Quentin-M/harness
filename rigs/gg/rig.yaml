version: "0.2"
name: gg
culture_file: CULTURE.md
permission_policy: builtin:yolo  # claude --dangerously-skip-permissions, codex danger-full-access
summary: >
  gg delivery team. lead pod (primary + peer) dispatches through the queue; dev designs and
  builds; verify proves each head SHA live and reviews the diff. Start with
  rig up rigs/gg/rig.yaml.

pods:
  - id: lead
    label: Lead
    members:
      - id: lead
        agent_ref: "local:../../agents/lead"
        profile: primary
        runtime: claude-code
        model: claude-opus-5-5[1m]
        compaction_strategy: managed-compaction
        cwd: /Users/quentin.machu-ext/Workspace/gg
      - id: peer
        agent_ref: "local:../../agents/lead"
        profile: peer
        runtime: codex
        model: gpt-6.1-sol
        cwd: /Users/quentin.machu-ext/Workspace/gg
    edges:
      - {kind: collaborates_with, from: peer, to: lead}

  - id: dev
    label: Development
    members:
      - id: architect
        agent_ref: "local:../../agents/architect"
        profile: default
