version: "0.2"
name: gg
culture_file: CULTURE.md
permission_policy: builtin:yolo  # claude --dangerously-skip-permissions, codex danger-full-access
summary: >
  gg delivery team. lead pod talks to Q and keeps seats healthy; dev designs and builds; verify
  reviews, proves and judges. Seats hand off to each other through the queue. Start with
  rig up rigs/gg/rig.yaml.

pods:
