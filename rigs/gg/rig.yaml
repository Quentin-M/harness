        profile: primary
        runtime: claude-code
        model: claude-opus-5-5[1m]
        compaction_strategy: managed-compaction
        cwd: /Users/quentin.machu-ext/Workspace/gg
      - id: peer
        agent_ref: "local:../../agents/lead"
        profile: peer
        runtime: codex
        model: gpt-6.1-sol
        cwd: /Users/quentin.machu-ext/Workspace/gg
    edges:
