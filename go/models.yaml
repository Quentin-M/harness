# Model catalog and roles. Agents and skills name roles only; model ids live here.
# The gateway URL and key command come from Claude Code managed settings (env overrides win).
#
# role      used by
# default   main session
# review    review seats, other family than default
# fast      omp smol, cheap subagents
# vision    omp vision/commit
# tiny      omp tiny/memory/judge
# advisor   omp advisor and WATCHDOG Advisor; default when unset
# slow      omp slow (Thinking); default when unset
# A `:low|:medium|:high` suffix pins omp's thinking level.
provider: bitmex
api: openai
disable_strict_tools: true

models:
  gpt-5.6-terra: {name: GPT-5.6 Terra via LiteLLM, context: 922000, max_tokens: 128000, reasoning: true, input: [text, image]}
  gpt-5.6-luna:  {name: GPT-5.6 Luna via LiteLLM, context: 922000, max_tokens: 128000, reasoning: true, input: [text, image]}
  gpt-6.1-sol:   {name: GPT-6.1 Sol via LiteLLM, context: 1050000, max_tokens: 131072, reasoning: true, input: [text, image]}
  claude-opus-5-5:      {name: Opus 5.5 (1M) via LiteLLM, api: anthropic, context: 1000000, max_tokens: 128000, reasoning: true, input: [text, image]}
  claude-sonnet-5-5:    {name: Sonnet 5.5 (1M) via LiteLLM, api: anthropic, context: 1000000, max_tokens: 128000, reasoning: true, input: [text, image]}
  deepseek-v4.1-flash-1017: {name: DeepSeek V4.1 Flash 1017 via LiteLLM, context: 1048576, max_tokens: 262144, reasoning: true, input: [text, image]}

roles:
  default: claude-opus-5-5
  review: gpt-6.1-sol
  fast: claude-sonnet-5-5
  vision: gpt-5.6-terra
  tiny: gpt-5.6-luna

overrides:
  codex: {default: gpt-6.1-sol}
  # omp spends gpt-6.1-sol on review only; claude and codex fall back to default for slow
  omp:
    default: deepseek-v4.1-flash-1017
    fast: deepseek-v4.1-flash-1017:low
    tiny: deepseek-v4.1-flash-1017
    advisor: claude-opus-5-5:medium
    slow: claude-opus-5-5:high
