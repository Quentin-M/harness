# Model catalog and roles. Agents and skills name roles only; model ids live here.
# The gateway URL and key command come from Claude Code managed settings (env overrides win).
# Without a gateway every harness runs on its own subscription login: `subscription` names the
# omp provider serving a model there (claude speaks anthropic, codex openai-codex). A role whose
# model none serves takes the model's `fallback`, else default.
#
# role      used by
# default   main session
# review    reviewers, other family than default
# fast      general subagents: claude CLAUDE_CODE_SUBAGENT_MODEL and Explore, omp task
# smol      omp scout/sonic/commit: read-only discovery and summaries
# advisor   omp end-of-task Reviewer (advisor.reviewMode: agent-end); default when unset
# vision    omp vision
# tiny      omp tiny/memory/judge
# slow      omp slow (Thinking); default when unset
# A `:low|:medium|:high` suffix pins omp's thinking level.
provider: bitmex
api: openai
disable_strict_tools: true

models:
  gpt-5.6-terra: {name: GPT-5.6 Terra via LiteLLM, context: 922000, max_tokens: 128000, reasoning: true, input: [text, image], subscription: openai-codex}
  gpt-5.6-luna:  {name: GPT-5.6 Luna via LiteLLM, context: 922000, max_tokens: 128000, reasoning: true, input: [text, image], subscription: openai-codex}
  gpt-6.1-sol:   {name: GPT-6.1 Sol via LiteLLM, context: 1050000, max_tokens: 131072, reasoning: true, input: [text, image], subscription: openai-codex}
  # cost is the gateway's $/M; omp's cache warmer needs it and prompt_cache (TTL seconds) to fire.
  claude-opus-5-5:      {name: Opus 5.5 (1M) via LiteLLM, api: anthropic, context: 1000000, max_tokens: 128000, reasoning: true, input: [text, image],
                         cost: {input: 4, output: 20, cacheRead: 0.2, cacheWrite: 5}, prompt_cache: {short: 300, long: 3600}, subscription: anthropic}
  claude-sonnet-5-5:    {name: Sonnet 5.5 (1M) via LiteLLM, api: anthropic, context: 1000000, max_tokens: 128000, reasoning: true, input: [text, image],
                         cost: {input: 2, output: 10, cacheRead: 0.1, cacheWrite: 2.5}, prompt_cache: {short: 300, long: 3600}, subscription: anthropic}
  deepseek-v4.1-flash-1017: {name: DeepSeek V4.1 Flash 1017 via LiteLLM, context: 1048576, max_tokens: 262144, reasoning: true, input: [text, image],
                             fallback: claude-sonnet-5-5}

roles:
  default: claude-opus-5-5
  review: gpt-6.1-sol
  fast: claude-sonnet-5-5
  vision: gpt-5.6-terra
  tiny: gpt-5.6-luna

overrides:
  codex: {default: gpt-6.1-sol}
  # omp spends gpt-6.1-sol on review only; claude and codex fall back to default for slow.
  # deepseek needs 3-5x opus's requests at the same per-request latency, so it backs only the
  # read-only and small roles.
  omp:
    smol: deepseek-v4.1-flash-1017:low
    tiny: deepseek-v4.1-flash-1017
    slow: claude-opus-5-5:high
    advisor: gpt-6.1-sol:high
