symbolPreset: nerd
theme:
  dark: dark-catppuccin
setupVersion: 2
defaultThinkingLevel: medium
composer:
  shape: field
  tokenRate: true
display:
  collapsedToolTitles: true
  groupToolCalls: true
  cacheMissMarker: true
  showTokenUsage: true
  showTurnTime: true
compaction:
  experimentalContextManagement: false
  methodOrder:
  - snapcompact
  - remote
  - handoff
  - soft
  - shake
  idleEnabled: true
  idleThresholdTokens: 100000
  # The cache warmer keeps a 5m entry alive for an hour idle. Compact 10 min before it lets go,
  # so a long final reply (the timer starts when it ends) still compacts on a warm cache.
  idleTimeoutSeconds: 3000
  thresholdPercent: 70
hideThinkingBlock: true
personality: pragmatic
advisor:
  enabled: true
  continueSeverity: blocker
  syncBacklog: 'off'
  immuneTurns: 5
  maxNotesPerUpdate: 3
prewalk:
  enabled: false
steeringMode: all
followUpMode: all
interruptMode: immediate
startup:
  quiet: true
  # omp runs the vendors/omp fork (make omp); `omp update` would swap in upstream.
  checkUpdate: false
power:
  sleepPrevention: 'off'
extendedContext: true
autolearn:
  enabled: false
  autoContinue: true
bash:
  allowCompoundCommands: true
astGrep:
  enabled: true
computer:
  enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
security:
  enabled: false
todo:
  remindersMax: 5
plan:
  autosave: true
task:
  eager: preferred
  enableLsp: true
  isolation:
    enabled: false
  agentModelOverrides:
    reviewer: '@review'
    security-reviewer: '@review'
tools:
  outputMaxColumns: 256
dev:
  autoqaConsent: granted
read:
  renderMarkdown: true
  summarize:
    enabled: false
    prose: false
modelTags:
  review: {name: REVIEW}
  fast: {hidden: true}
  image: {hidden: true}
  web: {hidden: true}
  speech: {hidden: true}
  dictation: {hidden: true}
  widget: {hidden: true}
  judge: {hidden: true}
  memory: {hidden: true}
