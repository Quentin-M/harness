# Herdr
# Symlinked out of the store: the settings UI (prefix+S) writes here.
# Reference: https://herdr.dev/docs/config-reference/
onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+x"
# shift+backslash: fallback for terminals that report | as its base key plus shift.
split_vertical = ["prefix+v", "prefix+|", "prefix+shift+backslash"]
split_horizontal = "prefix+minus"
new_workspace = ["prefix+shift+n", "prefix+s"]
settings = "prefix+shift+s"
goto = ["prefix+g", "prefix+f"]
rename_tab = ["prefix+shift+t", "prefix+comma"]
detach = ["prefix+q", "prefix+d"]
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
# shift+hjkl resizes; swap moves to ctrl+hjkl
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+ctrl+j"
swap_pane_up = "prefix+ctrl+k"
swap_pane_right = "prefix+ctrl+l"
# prefix+1..9 already switches tabs (default), so agents and workspaces get their own modifiers.
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"
previous_agent = "prefix+alt+p"
next_agent = "prefix+alt+n"

[ui]
confirm_close = false
prompt_new_tab_name = false

# Default rows show only "claude" per agent; the session name lives in the terminal title.
status_indicators = "symbols"
[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "terminal_title_stripped", fg = "#ffffff" }],
  [
    { token = "machine", fg = "#8a8fa3", bold = false },
    { token = "workspace", fg = "#8a8fa3", bold = false },
    { token = "tab", fg = "#8a8fa3", bold = false },
  ],
]

[experimental]
pane_history = true
